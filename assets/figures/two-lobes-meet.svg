<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One variant can act through either lobe, so integration localizes the mechanism">
<defs><marker id="arrow_tlm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#274b6d"/></marker></defs>
<text x="24.0" y="28.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">ONE VARIANT, TWO POSSIBLE LOBES</text>
<rect x="285.0" y="40.0" width="70.0" height="32.0" rx="6" fill="#ffffff" stroke="#9c6b12"/>
<text x="320.0" y="59.9" font-size="11" font-weight="600" text-anchor="middle" fill="#17181b">variant</text>
<rect x="30.0" y="95.0" width="220.0" height="56.0" rx="6" fill="#eaf0f6" stroke="#cfcdc4"/>
<text x="140.0" y="127.5" font-size="13" font-weight="600" text-anchor="middle" fill="#17181b">molecular lobe</text>
<rect x="390.0" y="95.0" width="220.0" height="56.0" rx="6" fill="#eaf0f6" stroke="#cfcdc4"/>
<text x="500.0" y="127.5" font-size="13" font-weight="600" text-anchor="middle" fill="#17181b">genomic lobe</text>
<text x="140" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6a6d73">protein sequence to structure</text>
<text x="140" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6a6d73">does the protein still work?</text>
<text x="500" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6a6d73">DNA window to expression</text>
<text x="500" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6a6d73">how much protein is made?</text>
<line x1="305" y1="70" x2="160" y2="93" stroke="#274b6d" stroke-width="1.6" marker-end="url(#arrow_tlm)"/>
<line x1="335" y1="70" x2="480" y2="93" stroke="#274b6d" stroke-width="1.6" marker-end="url(#arrow_tlm)"/>
<rect x="240.0" y="232.0" width="160.0" height="44.0" rx="6" fill="#eaf0f6" stroke="#274b6d"/>
<text x="320.0" y="258.2" font-size="12" font-weight="600" text-anchor="middle" fill="#17181b">integrated model</text>
<line x1="232" y1="151" x2="270" y2="230" stroke="#274b6d" stroke-width="1.6" marker-end="url(#arrow_tlm)"/>
<line x1="408" y1="151" x2="370" y2="230" stroke="#274b6d" stroke-width="1.6" marker-end="url(#arrow_tlm)"/>
</svg>