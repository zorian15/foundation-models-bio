<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Scoring versus generating over a pocket">
<defs><marker id="arrow_svg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#274b6d"/></marker></defs>
<text x="40.0" y="52.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">SCORING  —  RATE A GIVEN MOLECULE</text>
<rect x="40.0" y="66.0" width="165.0" height="46.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="122.5" y="93.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">Candidate molecule</text>
<rect x="455.0" y="66.0" width="165.0" height="46.0" rx="6" fill="#eaf0f6" stroke="#cfcdc4"/>
<text x="537.5" y="93.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">Affinity score</text>
<line x1="205" y1="89" x2="455" y2="89" stroke="#274b6d" stroke-width="2" marker-end="url(#arrow_svg)"/>
<text x="330" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6a6d73">how well does it bind?</text>
<text x="40.0" y="168.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">GENERATING  —  INVENT A MOLECULE TO FIT</text>
<rect x="40.0" y="182.0" width="165.0" height="46.0" rx="6" fill="#eaf0f6" stroke="#cfcdc4"/>
<text x="122.5" y="209.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">Empty pocket</text>
<rect x="455.0" y="182.0" width="165.0" height="46.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="537.5" y="209.2" font-size="12" font-weight="400" text-anchor="middle" fill="#17181b">Novel molecule</text>
<line x1="205" y1="205" x2="455" y2="205" stroke="#274b6d" stroke-width="2" marker-end="url(#arrow_svg)"/>
<text x="330" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6a6d73">what fits this shape?</text>
</svg>