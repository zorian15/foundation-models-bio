<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="AUROC flatters while AUPRC exposes poor precision">
<text x="24.0" y="28.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">SAME MODEL, TWO VERDICTS UNDER IMBALANCE</text>
<rect x="60" y="60" width="240" height="200" rx="4" fill="none" stroke="#e4e3dd"/>
<text x="180" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#17181b">ROC curve</text>
<line x1="60" y1="260" x2="300" y2="60" stroke="#6a6d73" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M 60 260 Q 72 90 300 60" fill="none" stroke="#274b6d" stroke-width="2.2"/>
<text x="200" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#274b6d">AUROC ~ 0.95</text>
<text x="180" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6a6d73">false positive rate to true positive rate</text>
<rect x="360" y="60" width="240" height="200" rx="4" fill="none" stroke="#e4e3dd"/>
<text x="480" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#17181b">precision-recall curve</text>
<line x1="360" y1="252" x2="600" y2="252" stroke="#6a6d73" stroke-width="1" stroke-dasharray="2 3"/>
<text x="366" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" fill="#6a6d73">baseline = prevalence</text>
<path d="M 360 95 Q 470 235 600 240" fill="none" stroke="#b04a3f" stroke-width="2.2"/>
<text x="470" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#b04a3f">AUPRC ~ 0.30</text>
<text x="480" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6a6d73">recall to precision</text>
</svg>