<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A spatial model is a single-cell model plus a neighbor graph">
<defs><marker id="arrow_snm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#274b6d"/></marker></defs>
<text x="24.0" y="40.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">SINGLE-CELL MODEL</text>
<rect x="30.0" y="55.0" width="180.0" height="40.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="120.0" y="78.5" font-size="10" font-weight="400" text-anchor="middle" fill="#17181b">one cell's expression</text>
<line x1="212" y1="75" x2="268" y2="75" stroke="#274b6d" stroke-width="1.8" marker-end="url(#arrow_snm)"/>
<rect x="272.0" y="55.0" width="140.0" height="40.0" rx="6" fill="#eaf0f6" stroke="#cfcdc4"/>
<text x="342.0" y="78.8" font-size="11" font-weight="600" text-anchor="middle" fill="#17181b">cell type</text>
<text x="24.0" y="150.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">SPATIAL MODEL</text>
<circle cx="120" cy="185" r="8" fill="#274b6d"/>
<line x1="120" y1="185" x2="86" y2="163" stroke="#cfcdc4" stroke-width="1.4"/>
<circle cx="86" cy="163" r="6" fill="#6a6d73"/>
<line x1="120" y1="185" x2="154" y2="163" stroke="#cfcdc4" stroke-width="1.4"/>
<circle cx="154" cy="163" r="6" fill="#6a6d73"/>
<line x1="120" y1="185" x2="86" y2="207" stroke="#cfcdc4" stroke-width="1.4"/>
<circle cx="86" cy="207" r="6" fill="#6a6d73"/>
<line x1="120" y1="185" x2="154" y2="207" stroke="#cfcdc4" stroke-width="1.4"/>
<circle cx="154" cy="207" r="6" fill="#6a6d73"/>
<text x="120" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6a6d73">cell + neighbor graph</text>
<line x1="180" y1="185" x2="268" y2="185" stroke="#274b6d" stroke-width="1.8" marker-end="url(#arrow_snm)"/>
<rect x="272.0" y="165.0" width="160.0" height="40.0" rx="6" fill="#eaf0f6" stroke="#cfcdc4"/>
<text x="352.0" y="188.8" font-size="11" font-weight="600" text-anchor="middle" fill="#17181b">spatial domain</text>
<text x="470" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#b04a3f">the one new ingredient: the edge</text>
</svg>