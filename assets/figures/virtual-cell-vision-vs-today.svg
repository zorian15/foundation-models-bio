<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One model in the vision, three narrow ones in practice">
<defs><marker id="arrow_vc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#274b6d"/></marker></defs>
<line x1="360" y1="50" x2="360" y2="290" stroke="#e4e3dd" stroke-width="1"/>
<text x="30.0" y="34.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">THE VISION</text>
<text x="160" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6a6d73">any cell state + any perturbation</text>
<line x1="160" y1="96" x2="160" y2="116" stroke="#274b6d" stroke-width="1.8" marker-end="url(#arrow_vc)"/>
<rect x="40.0" y="120.0" width="240.0" height="56.0" rx="6" fill="#eaf0f6" stroke="#274b6d"/>
<text x="160.0" y="152.6" font-size="13" font-weight="600" text-anchor="middle" fill="#17181b">The virtual cell</text>
<line x1="160" y1="176" x2="160" y2="196" stroke="#274b6d" stroke-width="1.8" marker-end="url(#arrow_vc)"/>
<text x="160" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6a6d73">predicted multi-modal response</text>
<text x="410.0" y="34.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">TODAY</text>
<rect x="420.0" y="70.0" width="250.0" height="34.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="545.0" y="90.8" font-size="11" font-weight="600" text-anchor="middle" fill="#17181b">Co-folder</text>
<text x="545" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6a6d73">structure + ligand, one complex</text>
<rect x="420.0" y="140.0" width="250.0" height="34.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="545.0" y="160.8" font-size="11" font-weight="600" text-anchor="middle" fill="#17181b">DNA model (Evo 2)</text>
<text x="545" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6a6d73">spans the central dogma, from sequence</text>
<rect x="420.0" y="210.0" width="250.0" height="34.0" rx="6" fill="#ffffff" stroke="#cfcdc4"/>
<text x="545.0" y="230.8" font-size="11" font-weight="600" text-anchor="middle" fill="#17181b">Perturbation model (State)</text>
<text x="545" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6a6d73">perturbation to expression shift</text>
<text x="545" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#b04a3f">no shared weights among the three</text>
</svg>