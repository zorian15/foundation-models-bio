<text x="520" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#3b3d42">CosMx</text>
<line x1="470" y1="200" x2="470" y2="130" stroke="#6a6d73" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow_srb)"/>
<line x1="165" y1="95" x2="235" y2="95" stroke="#6a6d73" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow_srb)"/>
