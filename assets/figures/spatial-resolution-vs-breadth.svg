<circle cx="270" cy="320" r="6" fill="#274b6d"/><text x="283" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6a6d73">imaging-based</text>
