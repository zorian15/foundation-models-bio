<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Imaging reads every transcript for a panel; sequencing reads the whole transcriptome but blurs cells">
<defs><marker id="arrow_srb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6d73"/></marker></defs>
<text x="24.0" y="28.0" font-size="11" font-weight="700" fill="#6a6d73" letter-spacing="1">OPPOSITE CORNERS OF ONE TRADEOFF</text>
<line x1="80" y1="270" x2="560" y2="270" stroke="#cfcdc4" stroke-width="1"/>
<line x1="80" y1="70" x2="80" y2="270" stroke="#cfcdc4" stroke-width="1"/>
<text x="320" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6a6d73">spatial resolution (coarse to subcellular)</text>
<text x="34" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6a6d73" transform="rotate(-90 34 170)">genes measured (log)</text>
<circle cx="150" cy="95" r="6" fill="#9c6b12"/>
<text x="150" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#3b3d42">Visium</text>
<circle cx="280" cy="105" r="6" fill="#9c6b12"/>
<text x="280" y="93" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#3b3d42">Slide-seq</text>
<circle cx="470" cy="110" r="6" fill="#9c6b12"/>
<text x="470" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#3b3d42">Stereo-seq / Visium HD</text>
<circle cx="420" cy="210" r="6" fill="#274b6d"/>
<text x="420" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#3b3d42">MERFISH</text>
